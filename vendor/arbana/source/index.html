    <title>Пора — ваша поездка</title>
    <!-- Тема ставится до загрузки приложения, иначе тёмный экран мигнёт светлым.
         Порядок тот же, что в src/app/theme/theme.ts: адрес → localStorage → система. -->
    <script>
      (function () {
        try {
          var url = new URLSearchParams(location.search).get('theme');
          var theme = url === 'dark' || url === 'light' ? url : null;
          if (!theme) {
            var saved = localStorage.getItem('pora-theme');
            theme =
              saved === 'dark' || saved === 'light'
                ? saved
                : matchMedia('(prefers-color-scheme: dark)').matches
                  ? 'dark'
                  : 'light';
          }
          document.documentElement.dataset.theme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.content = theme === 'dark' ? '#0e0f11' : '#2C5DEB';
        } catch (error) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
